<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Radar Grid Circles -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.25" />
  <circle cx="96" cy="96" r="48" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Protective Shield -->
  <path d="M96 28 L142 46 V92 C142 124 122 152 96 164 C70 152 50 124 50 92 V46 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="3" 
        filter="url(#glow)" />

  <!-- Inner Shockwave / Heartbeat / Collision Telemetry Pulse -->
  <path d="M68 96 L82 96 L90 80 L98 112 L106 90 L112 96 L124 96" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Emergency Core Beacon -->
  <circle cx="96" cy="96" r="5" fill="#ffffff" />
</svg>
