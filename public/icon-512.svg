<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.35" />

  <!-- Radar Grid Circles -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Protective Shield -->
  <path d="M256 75 L380 124 V246 C380 332 326 406 256 438 C186 406 132 332 132 246 V124 Z" 
        fill="url(#shieldGrad512)" 
        stroke="#ffffff" 
        stroke-width="7" 
        filter="url(#glow512)" />

  <!-- Inner Shockwave / Telemetry Crash Impulse Curve -->
  <path d="M182 256 L220 256 L240 214 L262 300 L284 240 L300 256 L332 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Core Emergency Status Beacon -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
</svg>
