name: Android Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accident-guard-android-debug
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install
      - name: Run web tests and build Android assets
        run: |
          npm test
          npm run build:android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK and JVM tests
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Upload Android build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accidentguard-android-debug-reports
          path: android/app/build/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: accidentguard-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
