name: Build Android App Bundle & APK for Google Play Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release Bundle (.aab & .apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Run Algorithm Verification Tests
        run: npm test

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Universal Android APK (.apk)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accidentguard-playstore-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Release APK (.apk) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accidentguard-release-apk
          path: android/app/build/outputs/apk/release/*.apk
